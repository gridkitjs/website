name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Production renders released packages only; `development` tracks the
      # `dev` snapshots, so only pull requests into `main` must be free of them.
      # `base_ref` is set on pull_request events alone.
      - name: Check gridkit versions are releases
        if: github.base_ref == 'main'
        run: node scripts/check-release-deps.mjs

      # `development` is next.gridkitjs.com, which renders the docs gridkit
      # publishes to `docs-meta-next`; everything else renders the pin in
      # gridkit.json, as production does.
      - uses: ./.github/actions/site-checks
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          manifest-ref: ${{ (github.ref == 'refs/heads/development' || github.base_ref == 'development') && 'docs-meta-next' || '' }}

      # `prebuild` regenerates the live examples' sources from
      # components/live-examples. A committed copy that no longer matches means
      # an example changed without the regeneration being committed.
      - name: Check generated example sources are current
        run: git diff --exit-code lib/docs/example-sources.generated.ts
