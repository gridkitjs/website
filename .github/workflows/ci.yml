name: CI

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit

      # The build fetches the docs manifest from the public gridkitjs/gridkitjs
      # repo through the GitHub API; the built-in token lifts the
      # unauthenticated rate limit.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
