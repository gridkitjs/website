name: Site checks
description: >
  Format, lint, types, the unit tests, the build, and the guards that read
  the build: prerendered docs routes and registered manifest tags. Expects
  the repo checked out and its dependencies installed. On a failure, it
  writes the failed check's name (format, lint, types, test, build, routes
  or tags) to $RUNNER_TEMP/failed-check.

inputs:
  github-token:
    description: >
      Token for the GitHub API. The build fetches the docs manifest from the
      public gridkitjs/gridkitjs repo, and a token lifts the unauthenticated
      rate limit.
    required: true
  manifest-ref:
    description: >
      Branch of gridkitjs/gridkitjs whose docs manifest the build reads, such
      as docs-meta-next. Empty reads the pin in gridkit.json.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Before gridkit first publishes the ref, the build falls back to the pin
    # (with a warning) rather than failing every run on that branch.
    - name: Read the docs manifest at ${{ inputs.manifest-ref }}
      if: inputs.manifest-ref != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MANIFEST_REF: ${{ inputs.manifest-ref }}
      run: node scripts/use-manifest-ref.mjs "$MANIFEST_REF"

    - id: format
      shell: bash
      run: npm run format:check
    - id: lint
      shell: bash
      run: npm run lint
    - id: types
      shell: bash
      run: npx tsc --noEmit
    # Node strips the tests' types itself. The repo's package.json sets no
    # `type`, so without the flag Node warns that it detected ESM.
    - id: test
      shell: bash
      run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test "lib/**/*.test.ts"

    # The log is kept for the route check below, and `pipefail` keeps a failed
    # build from being hidden by `tee`.
    - name: Build
      id: build
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -o pipefail
        npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"

    # A route that reads request headers renders on demand (`ƒ`): the build
    # still succeeds, but every visit would then render it, the docs and
    # changelog behind the loading skeleton. Fails unless the docs, changelog
    # and theme builder routes are prerendered (`●`).
    - name: Check routes are prerendered
      id: routes
      shell: bash
      run: node scripts/check-prerendered-routes.mjs "$RUNNER_TEMP/build.log"

    # The two repos couple by tag name only. A docs manifest using a live
    # example or component this site doesn't register would render a
    # placeholder, so the PR that pins it fails until the example lands.
    # Reads the public/mdx-tags.json that `prebuild` wrote.
    - name: Check manifest tags are registered
      id: tags
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node scripts/check-manifest-tags.mjs

    # The release workflow comments the failed check on its pull request. A
    # composite action's outputs can't be relied on once it has failed, so
    # the name goes through a file in the job's temp directory.
    - name: Name the failed check
      if: failure()
      shell: bash
      env:
        OUTCOMES: >-
          format=${{ steps.format.outcome }}
          lint=${{ steps.lint.outcome }}
          types=${{ steps.types.outcome }}
          test=${{ steps.test.outcome }}
          build=${{ steps.build.outcome }}
          routes=${{ steps.routes.outcome }}
          tags=${{ steps.tags.outcome }}
      run: |
        for outcome in $OUTCOMES; do
          if [ "${outcome#*=}" = failure ]; then
            echo "${outcome%%=*}" > "$RUNNER_TEMP/failed-check"
            break
          fi
        done
